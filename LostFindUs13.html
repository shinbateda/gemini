      // --- 수정된 SafeZoneView (안심존 관리: 필터링 및 지도 표시 - props 적용) ---
      const SafeZoneView = ({
        onBack,
        safeZones,
        onToggleZone,
        onSelectZone
      }) => {
        const [activeTab, setActiveTab] = useState('child')

        const filteredZones = safeZones.filter(z => z.type === activeTab)

        return (
          <div className='absolute inset-0 z-[70] bg-[#f5f6f8] flex flex-col animate-fade-in'>
            <header className='bg-white text-gray-800 p-4 pt-6 flex items-center gap-3 shadow-sm'>
              <div className='cursor-pointer' onClick={onBack}>
                <Icon name='ChevronLeft' size={24} />
              </div>
              <h1 className='text-lg font-bold'>안심존 관리</h1>
            </header>

            <div className='bg-white px-4 pb-4 pt-2'>
              <div className='flex bg-gray-100 p-1 rounded-xl'>
                {['자녀', '부모님', '반려동물'].map(tab => {
                  const value =
                    tab === '자녀'
                      ? 'child'
                      : tab === '부모님'
                      ? 'parent'
                      : 'pet'
                  const isActive = activeTab === value
                  return (
                    <button
                      key={value}
                      onClick={() => setActiveTab(value)}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                        isActive
                          ? 'bg-white text-[#4a4b70] shadow-sm'
                          : 'text-gray-400 hover:text-gray-600'
                      }`}
                    >
                      <Icon
                        name={
                          value === 'child'
                            ? 'User'
                            : value === 'parent'
                            ? 'Users'
                            : 'ShieldAlert'
                        }
                        size={12}
                        className='mr-1'
                      />
                      {tab}
                    </button>
                  )
                })}
              </div>
            </div>

            <div className='flex-1 overflow-y-auto p-4 pb-24'>
              {/* Map Preview: Filtered Zones Display */}
              <div className='bg-gray-200 h-48 rounded-2xl mb-6 relative overflow-hidden flex items-center justify-center border border-gray-300/50 shadow-inner'>
                <div
                  className='absolute inset-0 opacity-20'
                  style={{
                    backgroundImage:
                      'linear-gradient(#94a3b8 1px, transparent 1px), linear-gradient(90deg, #94a3b8 1px, transparent 1px)',
                    backgroundSize: '20px 20px'
                  }}
                ></div>

                {filteredZones.map(zone => (
                  <div
                    key={zone.id}
                    className={`absolute flex items-center justify-center rounded-full border transition-all duration-300 ease-in-out ${
                      zone.mapPos.size
                    } 
                          ${
                            zone.active
                              ? 'border-green-500/30 bg-green-500/10'
                              : 'border-gray-400/50 bg-gray-400/10 grayscale opacity-40'
                          }`}
                    style={{
                      top: zone.mapPos.top,
                      left: zone.mapPos.left,
                      transform: 'translate(-50%, -50%)'
                    }}
                  >
                    {/* Smaller Icon inside the zone circle */}
                    <div
                      className={`w-6 h-6 rounded-full flex items-center justify-center transition-colors duration-300 ${
                        zone.active
                          ? 'bg-green-500/20 text-green-700'
                          : 'bg-gray-500/20 text-gray-500'
                      }`}
                    >
                      <Icon name={zone.icon} size={10} />
                    </div>
                  </div>
                ))}

                <div className='absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm text-gray-600 border border-white flex items-center gap-1'>
                  <Icon name='MapPin' size={12} /> {filteredZones.length}개 구역
                </div>
              </div>

              <h3 className='font-bold text-gray-800 mb-3 text-sm px-1'>
                등록된 안심존 (
                {activeTab === 'child'
                  ? '자녀'
                  : activeTab === 'parent'
                  ? '부모님'
                  : '반려동물'}
                )
              </h3>

              <div className='space-y-3'>
                {filteredZones.map(zone => (
                  <div
                    key={zone.id}
                    onClick={() => onSelectZone(zone)}
                    className='bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center gap-4 transition-transform active:scale-[0.99] cursor-pointer'
                  >
                    <div
                      className={`w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0 ${
                        zone.active
                          ? 'bg-green-50 text-green-600'
                          : 'bg-gray-100 text-gray-400'
                      }`}
                    >
                      <Icon name={zone.icon} size={20} />
                    </div>
                    <div className='flex-1 min-w-0'>
                      <div className='flex items-center justify-between'>
                        <h4
                          className={`font-bold text-sm truncate ${
                            zone.active ? 'text-gray-800' : 'text-gray-400'
                          }`}
                        >
                          {zone.name}
                        </h4>
                      </div>
                      <p className='text-xs text-gray-400 mt-0.5 truncate'>
                        {zone.address}
                      </p>
                      <div className='flex items-center gap-2 mt-2'>
                        <span className='text-[10px] bg-gray-50 text-gray-500 px-2 py-0.5 rounded border border-gray-100 font-medium'>
                          반경 {zone.radius}
                        </span>
                        <span
                          className={`text-[10px] flex items-center gap-1 ${
                            zone.active
                              ? 'text-green-600 font-bold'
                              : 'text-gray-300'
                          }`}
                        >
                          <Icon name='Bell' size={10} />{' '}
                          {zone.active ? '알림 ON' : '알림 OFF'}
                        </span>
                      </div>
                    </div>
                    <div
                      onClick={e => {
                        e.stopPropagation()
                        onToggleZone(zone.id)
                      }}
                      className={`w-12 h-7 rounded-full relative cursor-pointer transition-colors duration-300 ease-in-out shrink-0 ${
                        zone.active ? 'bg-green-500' : 'bg-gray-300'
                      }`}
                    >
                      <div
                        className={`absolute top-1 w-5 h-5 bg-white rounded-full shadow-md transition-transform duration-300 ease-in-out ${
                          zone.active ? 'translate-x-6' : 'translate-x-1'
                        }`}
                      ></div>
                    </div>
                  </div>
                ))}
                {filteredZones.length === 0 && (
                  <div className='text-center py-10 text-gray-400 text-sm'>
                    등록된 안심존이 없습니다.
                  </div>
                )}
              </div>
            </div>
            <div className='absolute bottom-6 right-6 z-20'>
              <button className='w-14 h-14 bg-[#4a4b70] hover:bg-[#3d3e5c] rounded-full shadow-xl shadow-[#4a4b70]/40 flex items-center justify-center text-white active:scale-90 transition-transform'>
                <Icon name='Plus' size={24} />
              </button>
            </div>
          </div>
        )
      }

      // --- MapView 컴포넌트 ---
      const MapView = ({ onAction, onNavigate, onMarkerSelect, safeZones }) => {
        const [listFilter, setListFilter] = useState('전체')
        const [mapFilter, setMapFilter] = useState('전체')
        const [sortMode, setSortMode] = useState('최신')
        const [isTracking, setIsTracking] = useState(false)
        const [zoom, setZoom] = useState(1)

        const [pan, setPan] = useState({ x: 0, y: 0 })
        const [isDragging, setIsDragging] = useState(false)
        const dragStart = useRef({ x: 0, y: 0 })

        const handleMouseDown = e => {
          setIsDragging(true)
          dragStart.current = { x: e.clientX - pan.x, y: e.clientY - pan.y }
        }

        const handleMouseMove = e => {
          if (!isDragging) return
          e.preventDefault()
          const clientX = e.touches ? e.touches[0].clientX : e.clientX
          const clientY = e.touches ? e.touches[0].clientY : e.clientY
          const x = clientX - dragStart.current.x
          const y = clientY - dragStart.current.y
          setPan({ x, y })
        }

        const handleMouseUp = () => {
          setIsDragging(false)
        }

        const handleTouchStart = e => {
          setIsDragging(true)
          const touch = e.touches[0]
          dragStart.current = {
            x: touch.clientX - pan.x,
            y: touch.clientY - pan.y
          }
        }

        const handleWheel = e => {
          const zoomSensitivity = 0.001
          const newZoom = zoom - e.deltaY * zoomSensitivity
          setZoom(Math.min(Math.max(newZoom, 0.5), 3))
        }

        const toggleTracking = () => {
          setIsTracking(!isTracking)
          onAction(isTracking ? '탐지 모드 종료' : 'Track-FOM 가동')
        }
        const handleZoomIn = () => setZoom(prev => Math.min(prev + 0.1, 3))
        const handleZoomOut = () => setZoom(prev => Math.max(prev - 0.1, 0.5))

        const filteredList = useMemo(() => {
          let data = [...missingListData]
          if (listFilter !== '전체')
            data = data.filter(item => item.type === listFilter)
          if (sortMode === '찾음') {
            data = data.filter(item => item.status === '찾음')
          } else {
            data = data.filter(item => item.status === '실종')
            if (sortMode === '거리')
              data.sort((a, b) => a.distance - b.distance)
            else if (sortMode === '현상금')
              data.sort((a, b) => b.reward - a.reward)
            else data.sort((a, b) => b.timestamp - a.timestamp)
          }
          return data
        }, [listFilter, sortMode])

        const visibleMarkers = useMemo(() => {
          const list = missingListData.map(item => ({
            ...item,
            fomScore: calculateFomScore(item)
          }))
          const jimin = {
            id: 'jimin',
            type: '사람',
            name: '지민',
            pos: { top: '45%', left: '48%' },
            img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Jimin',
            isSafe: true,
            fomScore: 100
          }
          const allMarkers = [jimin, ...list].filter(m => m.status !== '찾음')
          if (mapFilter === '전체') return allMarkers
          return allMarkers.filter(m => m.type === mapFilter)
        }, [mapFilter])

        return (
          <div className='relative h-full w-full flex flex-col bg-[#f5f6f8]'>
            <header className='bg-[#464769] text-white p-4 pt-6 flex justify-between items-center z-30 shadow-md flex-none'>
              <div
                className='flex items-center gap-2 cursor-pointer'
                onClick={() => onAction('홈 이동')}
              >
                <div className='w-6 h-6 border-2 border-white rounded-md flex items-center justify-center'>
                  <div className='w-2 h-2 bg-white rounded-full'></div>
                </div>
                <span className='font-bold text-lg'>LostFindUs</span>
              </div>
              <div className='flex items-center gap-4'>
                <div
                  className='cursor-pointer'
                  onClick={() => onNavigate('notifications')}
                >
                  <Icon name='Bell' size={20} />
                </div>
                <Icon name='Menu' size={24} />
              </div>
            </header>

            <div className='bg-white z-20 shadow-sm flex-none rounded-b-xl border-b overflow-hidden'>
              <div className='flex justify-between items-center px-4 py-3'>
                <div className='flex items-center gap-2 text-gray-800 font-bold text-sm'>
                  <span className='text-[#4a4b70]'>
                    <Icon name='List' size={16} />
                  </span>{' '}
                  실시간 실종 현황 ({filteredList.length})
                </div>
                <button
                  onClick={() => onNavigate('missing-list')}
                  className='text-xs text-gray-500 font-medium flex items-center'
                >
                  더보기 <Icon name='ChevronRight' size={12} className='ml-1' />
                </button>
              </div>
              <div className='flex overflow-x-auto gap-2 px-4 pb-2 no-scrollbar'>
                {['전체', '사람', '동물', '물건'].map(f => (
                  <button
                    key={f}
                    onClick={() => setListFilter(f)}
                    className={`px-3 py-1 rounded-full text-[10px] font-bold border whitespace-nowrap transition-colors ${
                      listFilter === f
                        ? 'bg-[#4a4b70] text-white border-[#4a4b70] shadow-sm'
                        : 'border-gray-200 text-gray-500 bg-white hover:bg-gray-50'
                    }`}
                  >
                    {f}
                  </button>
                ))}
              </div>
              <div className='flex overflow-x-auto gap-2 px-4 pb-4 no-scrollbar border-b border-gray-50 mb-1'>
                {['최신', '거리', '현상금', '찾음'].map(mode => (
                  <button
                    key={mode}
                    onClick={() => setSortMode(mode)}
                    className={`px-3 py-1 text-[10px] font-bold rounded-lg transition-colors flex items-center gap-1 ${
                      sortMode === mode
                        ? 'bg-gray-100 text-[#4a4b70]'
                        : 'text-gray-400 hover:text-gray-600'
                    }`}
                  >
                    {sortMode === mode && (
                      <Icon name='CheckCircle2' size={10} />
                    )}{' '}
                    {mode === '찾음' ? '찾음' : mode + '순'}
                  </button>
                ))}
              </div>
              <div className='flex overflow-x-auto gap-3 px-4 pb-4 no-scrollbar'>
                {filteredList.length === 0 ? (
                  <div className='w-full text-center py-4 text-xs text-gray-400'>
                    해당하는 항목이 없습니다.
                  </div>
                ) : (
                  filteredList.map(item => (
                    <div
                      key={item.id}
                      className={`flex-none w-[180px] border rounded-xl p-2 flex gap-2.5 bg-white shadow-sm transition-all active:scale-95 ${
                        item.urgent ? 'border-red-100' : 'border-gray-100'
                      } ${
                        item.status === '찾음' ? 'opacity-80 bg-gray-50' : ''
                      }`}
                      onClick={() => onMarkerSelect(item)}
                    >
                      <div className='w-10 h-10 rounded-lg overflow-hidden flex-none bg-gray-50 relative'>
                        <img
                          src={item.img}
                          alt={item.name}
                          className={`w-full h-full object-cover ${
                            item.status === '찾음' ? 'grayscale' : ''
                          }`}
                        />
                        {item.urgent && item.status !== '찾음' && (
                          <span className='absolute top-1 left-1 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded font-bold'>
                            긴급
                          </span>
                        )}
                        {item.status === '찾음' && (
                          <span className='absolute top-1 left-1 bg-green-500 text-white text-[9px] px-1.5 py-0.5 rounded font-bold'>
                            찾음
                          </span>
                        )}
                      </div>
                      <div className='flex-1 py-0.5 min-w-0'>
                        <h4 className='font-bold text-gray-800 text-[11px] truncate'>
                          {item.name}
                        </h4>
                        <p className='text-[9px] text-gray-500 truncate'>
                          {item.location}
                        </p>
                        <p
                          className={`text-[9px] font-bold mt-1 ${
                            item.status === '찾음'
                              ? 'text-green-600'
                              : item.urgent
                              ? 'text-red-500'
                              : 'text-[#4a4b70]'
                          }`}
                        >
                          {item.status === '찾음' ? '보호 완료' : item.time}
                        </p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div
              className={`flex-1 relative overflow-hidden bg-[#e0e3e8] ${
                isDragging ? 'cursor-grabbing' : 'cursor-grab'
              }`}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseUp}
              onTouchStart={handleTouchStart}
              onTouchMove={handleMouseMove}
              onTouchEnd={handleMouseUp}
              onWheel={handleWheel}
            >
              <div
                className={`absolute inset-0 transition-opacity duration-1000 pointer-events-none ${
                  isTracking ? 'opacity-40' : 'opacity-10'
                }`}
              >
                <div
                  className={`w-full h-full ease-out origin-center ${
                    isDragging ? '' : 'transition-transform duration-300'
                  }`}
                  style={{
                    backgroundImage:
                      'linear-gradient(rgba(74, 75, 112, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(74, 75, 112, 0.2) 1px, transparent 1px)',
                    backgroundSize: '20px 20px',
                    transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`
                  }}
                ></div>
              </div>

              {isTracking && (
                <div
                  className={`absolute inset-0 z-10 pointer-events-none overflow-hidden ease-out origin-center ${
                    isDragging ? '' : 'transition-transform duration-300'
                  }`}
                  style={{
                    transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`
                  }}
                >
                  <div className='w-[200%] h-1 bg-gradient-to-r from-transparent via-[#4a4b70]/40 to-transparent absolute top-0 left-[-50%] animate-radar-scan'></div>
                </div>
              )}

              <div className='absolute top-4 left-4 right-4 flex justify-between z-10 pointer-events-none'>
                <div
                  onClick={toggleTracking}
                  className={`bg-white/95 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg text-sm font-bold flex items-center gap-2 pointer-events-auto border transition-all cursor-pointer ${
                    isTracking
                      ? 'text-[#4a4b70] border-[#4a4b70] ring-4 ring-[#4a4b70]/10 scale-105'
                      : 'text-gray-500 border-white/50'
                  }`}
                >
                  <Icon name='Target' size={14} /> Track-FOM
                </div>
                <div className='bg-white/95 backdrop-blur-sm rounded-full shadow-lg flex p-1 pointer-events-auto'>
                  {['전체', '사람', '동물', '물건'].map(f => (
                    <button
                      key={f}
                      onClick={() => setMapFilter(f)}
                      className={`text-xs px-3 py-1 rounded-full font-bold ${
                        mapFilter === f
                          ? 'bg-[#4a4b70] text-white shadow-inner'
                          : 'text-gray-500'
                      }`}
                    >
                      {f}
                    </button>
                  ))}
                </div>
              </div>

              <div
                className={`absolute inset-0 ease-out origin-center ${
                  isDragging ? '' : 'transition-transform duration-300'
                }`}
                style={{
                  transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`
                }}
              >
                <div className='absolute inset-0 pointer-events-none'>
                  {safeZones.map(
                    zone =>
                      zone.pos && (
                        <div
                          key={zone.id}
                          style={{
                            top: zone.pos.top,
                            left: zone.pos.left,
                            transform: `translate(-50%, -50%) scale(${
                              1 / zoom
                            })`
                          }}
                          className={`
                        ${zone.size} absolute rounded-full border-2 
                        ${
                          zone.active
                            ? 'border-green-400 bg-green-50/20 opacity-100'
                            : 'border-gray-400 bg-gray-500/10 opacity-30 grayscale'
                        } 
                        flex items-center justify-center transition-all duration-300
                      `}
                        >
                          <div className='absolute bottom-4 bg-green-600/80 text-white text-[9px] px-2 py-0.5 rounded-full border border-white/20 whitespace-nowrap'>
                            {zone.name}
                          </div>
                        </div>
                      )
                  )}
                </div>
                <div className='absolute inset-0 pointer-events-none'>
                  {visibleMarkers.map(m => {
                    const opacity = isTracking
                      ? Math.max(0.3, m.fomScore / 100)
                      : 1
                    const blurAmount = isTracking
                      ? Math.max(0, (100 - m.fomScore) / 12)
                      : 0
                    const baseScale = isTracking
                      ? 0.85 + (m.fomScore / 100) * 0.3
                      : 1
                    const finalScale = baseScale * (1 / zoom)

                    return (
                      <div
                        key={m.id}
                        style={{
                          top: m.pos.top,
                          left: m.pos.left,
                          opacity: opacity,
                          filter: `blur(${blurAmount}px)`,
                          transform: `translate(-50%, -50%) scale(${finalScale})`
                        }}
                        className='absolute pointer-events-auto flex flex-col items-center group cursor-pointer transition-all duration-700 ease-in-out'
                        onClick={() => onMarkerSelect(m)}
                      >
                        {isTracking && m.fomScore > 80 && (
                          <div className='absolute inset-0 w-16 h-16 -translate-x-2 -translate-y-2 rounded-full bg-[#4a4b70]/10 border border-[#4a4b70]/30 animate-ping-slow'></div>
                        )}
                        <div
                          className={`p-0.5 bg-white rounded-full shadow-2xl border-2 transition-transform group-hover:scale-110 ${
                            m.isSafe ? 'border-green-500' : 'border-red-500'
                          } ${
                            m.fomScore > 90 ? 'ring-4 ring-[#4a4b70]/20' : ''
                          }`}
                        >
                          <img
                            src={
                              m.img ||
                              `https://api.dicebear.com/7.x/avataaars/svg?seed=${m.name}`
                            }
                            className={`w-10 h-10 rounded-full ${
                              isTracking && m.fomScore > 70
                                ? 'animate-pulse'
                                : ''
                            }`}
                            alt={m.name}
                          />
                        </div>
                        <div
                          className={`mt-1 px-2 py-0.5 rounded-full text-[9px] font-bold text-white shadow-sm border border-white/30 ${
                            m.isSafe ? 'bg-green-600' : 'bg-red-500'
                          }`}
                        >
                          {m.name}
                        </div>
                        {isTracking && (
                          <div className='absolute -top-12 bg-black/80 text-[8px] text-white p-1.5 rounded-lg flex flex-col gap-0.5 border border-white/20 backdrop-blur-sm shadow-xl'>
                            <div className='flex items-center gap-1'>
                              <span className='text-blue-400'>
                                <Icon name='Wifi' size={8} />
                              </span>{' '}
                              {m.rssi}dBm
                            </div>
                            <div className='flex items-center gap-1'>
                              <span className='text-green-400'>
                                <Icon name='Layers' size={8} />
                              </span>{' '}
                              {m.collectors} EA
                            </div>
                          </div>
                        )}
                      </div>
                    )
                  })}
                </div>
              </div>

              <div className='absolute bottom-[100px] right-4 flex flex-col gap-3 z-10'>
                <button
                  onClick={handleZoomIn}
                  className='bg-white p-3 rounded-full shadow-xl text-gray-600 active:scale-90 transition-all border border-gray-100 flex items-center justify-center'
                >
                  <Icon name='Plus' size={20} />
                </button>
                <button
                  onClick={handleZoomOut}
                  className='bg-white p-3 rounded-full shadow-xl text-gray-600 active:scale-90 transition-all border border-gray-100 flex items-center justify-center'
                >
                  <Icon name='Minus' size={20} />
                </button>
                <button
                  onClick={() => onAction('실시간 AR 탐지 모드')}
                  className='bg-[#4a4b70] text-white p-3.5 rounded-full shadow-2xl active:scale-90 mt-1 shadow-[#4a4b70]/40 flex items-center justify-center'
                >
                  <Icon name='Camera' size={20} />
                </button>
              </div>
              <div className='absolute bottom-4 left-4 right-4 z-20'>
                <button
                  onClick={() => onNavigate('emergency-request')}
                  className='w-full bg-[#df3333] hover:bg-[#cc2e2e] active:scale-[0.98] text-white rounded-2xl py-4 font-bold shadow-2xl flex items-center justify-center gap-2 border-b-4 border-red-700/50'
                >
                  <Icon name='AlertCircle' size={20} /> 긴급 찾기 요청
                </button>
              </div>
            </div>
          </div>
        )
      }

      const ChatView = ({ onSelect }) => {
        return (
          <div className='flex-1 bg-white overflow-y-auto'>
            <header className='bg-white text-gray-800 p-4 pt-6 flex justify-between items-center sticky top-0 z-10 border-b border-gray-100'>
              <h1 className='text-xl font-bold'>채팅</h1>
              <Icon name='Plus' size={24} className='text-gray-400' />
            </header>
            <div className='divide-y divide-gray-50'>
              {chatListData.map(chat => (
                <div
                  key={chat.id}
                  onClick={() => onSelect(chat)}
                  className='p-4 flex gap-4 hover:bg-gray-50 cursor-pointer transition-colors'
                >
                  <div className='relative w-12 h-12 flex-none'>
                    <img
                      src={chat.img}
                      alt={chat.name}
                      className='w-full h-full rounded-full object-cover bg-gray-100'
                    />
                    {chat.unread > 0 && (
                      <span className='absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white font-bold'>
                        {chat.unread}
                      </span>
                    )}
                  </div>
                  <div className='flex-1 min-w-0'>
                    <div className='flex justify-between items-start mb-0.5'>
                      <h3 className='font-bold text-gray-900 truncate'>
                        {chat.name}
                      </h3>
                      <span className='text-[10px] text-gray-400 whitespace-nowrap'>
                        {chat.time}
                      </span>
                    </div>
                    <p className='text-sm text-gray-500 truncate'>{chat.msg}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )
      }

      const RewardsView = ({ onSelect, onNavigate }) => {
        return (
          <div className='flex-1 bg-[#f5f6f8] overflow-y-auto'>
            <header className='bg-[#4a4b70] text-white p-6 pb-12 rounded-b-[2rem] shadow-lg relative z-10'>
              <div className='flex justify-between items-center mb-6'>
                <h1 className='text-xl font-bold'>보상 센터</h1>
                <div className='bg-white/20 p-2 rounded-full cursor-pointer'>
                  <Icon name='Info' size={20} />
                </div>
              </div>
              <div className='text-center'>
                <p className='text-blue-100 text-sm mb-1'>나의 보유 포인트</p>
                <h2 className='text-4xl font-black mb-4'>12,500 P</h2>
                <div
                  onClick={() => onNavigate('point-exchange')}
                  className='inline-block bg-white text-[#4a4b70] px-6 py-2 rounded-full font-bold text-sm shadow-md active:scale-95 transition-transform cursor-pointer neon-border'
                >
                  포인트 교환하기
                </div>
              </div>
            </header>
            <div className='px-4 -mt-6 relative z-20 mb-4'>
              <div className='bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-around'>
                <div
                  className='text-center cursor-pointer active:scale-95 transition-transform'
                  onClick={() => onNavigate('ranking')}
                >
                  <div className='w-10 h-10 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-2 neon-border'>
                    <Icon name='Trophy' size={20} />
                  </div>
                  <span className='text-xs font-bold text-gray-600'>랭킹</span>
                </div>
                <div
                  className='text-center cursor-pointer active:scale-95 transition-transform'
                  onClick={() => onNavigate('mission')}
                >
                  <div className='w-10 h-10 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-2 neon-border'>
                    <Icon name='Star' size={20} />
                  </div>
                  <span className='text-xs font-bold text-gray-600'>미션</span>
                </div>
                <div
                  className='text-center cursor-pointer active:scale-95 transition-transform'
                  onClick={() => onNavigate('wallet')}
                >
                  <div className='w-10 h-10 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-2 neon-border'>
                    <Icon name='Wallet' size={20} />
                  </div>
                  <span className='text-xs font-bold text-gray-600'>지갑</span>
                </div>
              </div>
            </div>
            <div className='px-4 pb-20'>
              <h3 className='font-bold text-gray-800 mb-3 px-1'>최근 활동</h3>
              <div className='space-y-3'>
                {rewardHistoryData.map(item => (
                  <div
                    key={item.id}
                    onClick={() => onSelect(item)}
                    className='bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 cursor-pointer active:scale-95 transition-transform'
                  >
                    <div
                      className={`w-10 h-10 rounded-full flex items-center justify-center ${
                        item.type === 'earn'
                          ? 'bg-blue-50 text-blue-500'
                          : 'bg-orange-50 text-orange-500'
                      }`}
                    >
                      <Icon
                        name={item.type === 'earn' ? 'Coins' : 'Gift'}
                        size={20}
                      />
                    </div>
                    <div className='flex-1'>
                      <h4 className='font-bold text-gray-800 text-sm'>
                        {item.title}
                      </h4>
                      <p className='text-[10px] text-gray-400'>{item.date}</p>
                    </div>
                    <span
                      className={`font-bold text-sm ${
                        item.type === 'earn'
                          ? 'text-blue-600'
                          : 'text-orange-500'
                      }`}
                    >
                      {item.type === 'earn' ? '+' : ''}
                      {item.points.toLocaleString()}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )
      }

      const MenuSection = ({ title, items, onItemClick }) => {
        return (
          <div className='bg-white mb-3 p-4 pb-2 border-b border-gray-100 last:mb-0 last:border-0'>
            <h3 className='text-xs font-bold text-gray-400 mb-2'>{title}</h3>
            <div>
              {items.map((item, idx) => (
                <div
                  key={idx}
                  onClick={() => onItemClick(item)}
                  className='flex justify-between items-center py-3.5 border-b border-gray-50 last:border-0 cursor-pointer active:bg-gray-50'
                >
                  <span className='text-sm font-medium text-gray-700'>
                    {item}
                  </span>
                  <Icon
                    name='ChevronRight'
                    size={16}
                    className='text-gray-300'
                  />
                </div>
              ))}
            </div>
          </div>
        )
      }

      const MenuView = ({ setSubView, onAction }) => {
        const handleItemClick = item => {
          const map = {
            '제보 내역': 'my-reports',
            '관심 목록': 'my-watchlist',
            '포인트 내역': 'my-points',
            공지사항: 'notice',
            '자주 묻는 질문': 'faq',
            '1:1 문의': 'qna',
            이용약관: 'terms',
            '개인정보 처리방침': 'privacy'
          }
          if (map[item]) {
            setSubView(map[item])
          } else {
            onAction(`${item} 화면으로 이동합니다.`)
          }
        }

        return (
          <div className='flex-1 bg-white overflow-y-auto'>
            <header className='bg-white text-gray-800 p-4 pt-6 flex justify-between items-center sticky top-0 z-10 border-b border-gray-100'>
              <h1 className='text-xl font-bold'>전체 메뉴</h1>
              <div onClick={() => onAction('설정')} className='cursor-pointer'>
                <Icon name='Settings' size={24} className='text-gray-400' />
              </div>
            </header>
            <div className='p-6 pb-8 border-b border-gray-100'>
              <div className='flex items-center gap-4 mb-4'>
                <div className='w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-400'>
                  <Icon name='User' size={32} />
                </div>
                <div>
                  <div className='flex items-center gap-2'>
                    <h2 className='text-xl font-bold text-gray-900'>김시민</h2>
                    <span className='text-[10px] font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100'>
                      MY
                    </span>
                  </div>
                  <p className='text-sm text-gray-500 mt-0.5'>
                    Lv.3 시민 감시단
                  </p>
                </div>
              </div>
              <div className='flex gap-3'>
                <button
                  onClick={() => setSubView('my-profile')}
                  className='flex-1 bg-gray-50 text-gray-600 text-xs font-bold py-2.5 rounded-lg border border-gray-200 active:bg-gray-100 transition-colors'
                >
                  내 정보
                </button>
                <button
                  onClick={() => setSubView('safe-keeper')}
                  className='flex-1 bg-gray-50 text-gray-600 text-xs font-bold py-2.5 rounded-lg border border-gray-200 active:bg-gray-100 transition-colors'
                >
                  가족 관리
                </button>
              </div>
            </div>
            <div className='p-6 border-b border-gray-100'>
              <h3 className='text-xs font-bold text-gray-900 mb-4'>
                주요 서비스
              </h3>
              <div className='grid grid-cols-4 gap-2 text-center'>
                <div
                  onClick={() => setSubView('emergency-sos')}
                  className='flex flex-col items-center gap-2 cursor-pointer active:opacity-70'
                >
                  <div className='w-12 h-12 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center border border-red-100'>
                    <Icon name='AlertTriangle' size={20} />
                  </div>
                  <span className='text-[11px] font-medium text-gray-600'>
                    긴급신고
                  </span>
                </div>
                <div
                  onClick={() => setSubView('safe-return')}
                  className='flex flex-col items-center gap-2 cursor-pointer active:opacity-70'
                >
                  <div className='w-12 h-12 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center border border-green-100'>
                    <Icon name='Shield' size={20} />
                  </div>
                  <span className='text-[11px] font-medium text-gray-600'>
                    안심귀가
                  </span>
                </div>
                <div
                  onClick={() => setSubView('safe-zone')}
                  className='flex flex-col items-center gap-2 cursor-pointer active:opacity-70'
                >
                  <div className='w-12 h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center border border-blue-100'>
                    <Icon name='MapPin' size={20} />
                  </div>
                  <span className='text-[11px] font-medium text-gray-600'>
                    안심존
                  </span>
                </div>
                <div
                  onClick={() => setSubView('safe-keeper')}
                  className='flex flex-col items-center gap-2 cursor-pointer active:opacity-70'
                >
                  <div className='w-12 h-12 bg-purple-50 text-purple-500 rounded-2xl flex items-center justify-center border border-purple-100'>
                    <Icon name='Smartphone' size={20} />
                  </div>
                  <span className='text-[11px] font-medium text-gray-600'>
                    안심이 관리
                  </span>
                </div>
              </div>
            </div>
            <div className='bg-gray-50/50'>
              <MenuSection
                title='나의 활동'
                items={['제보 내역', '관심 목록', '포인트 내역']}
                onItemClick={handleItemClick}
              />
              <MenuSection
                title='고객 지원'
                items={['공지사항', '자주 묻는 질문', '1:1 문의']}
                onItemClick={handleItemClick}
              />
              <MenuSection
                title='앱 정보'
                items={['이용약관', '개인정보 처리방침']}
                onItemClick={handleItemClick}
              />
            </div>
            <div className='h-20'></div>
          </div>
        )
      }

      const App = () => {
        const [activeTab, setActiveTab] = useState('track')
        const [subView, setSubView] = useState(null)
        const [toastMessage, setToastMessage] = useState('')
        const [activeAlertData, setActiveAlertData] = useState(null)
        const [activeRewardData, setActiveRewardData] = useState(null)
        const [activeChatData, setActiveChatData] = useState(null)
        const [selectedProduct, setSelectedProduct] = useState(null)

        // 안심존 상태 (지도 및 리스트 동기화용)
        const [safeZones, setSafeZones] = useState(safeZonesData)
        // 안심존 상세 상태
        const [selectedSafeZone, setSelectedSafeZone] = useState(null)
        // [신규] 안심이 상세 상태
        const [selectedKeeperProfile, setSelectedKeeperProfile] = useState(null)
        // [신규] 안심이 리스트 상태
        const [keeperProfiles, setKeeperProfiles] =
          useState(managedProfilesData)

        const handleToggleSafeZone = id => {
          setSafeZones(prevZones =>
            prevZones.map(zone =>
              zone.id === id ? { ...zone, active: !zone.active } : zone
            )
          )
        }

        const handleDeleteSafeZone = id => {
          setSafeZones(prevZones => prevZones.filter(z => z.id !== id))
          setSubView('safe-zone')
          showToast('안심존이 삭제되었습니다.')
        }

        const handleAddKeeper = newProfile => {
          setKeeperProfiles([...keeperProfiles, newProfile])
          setSubView('safe-keeper') // 리스트로 복귀
          showToast(`${newProfile.name}님이 등록되었습니다.`)
        }

        const showToast = msg => {
          setToastMessage(msg)
          setTimeout(() => setToastMessage(''), 2500)
        }
        const handleMarkerSelect = data => {
          setActiveAlertData(data)
          setSubView('bystander-alert-detail')
        }
        const handleSimulateAlert = data => {
          setActiveAlertData(data)
          setSubView('bystander-alert-detail')
          setActiveTab('track')
        }

        return (
          <div className='min-h-screen bg-gray-900 sm:bg-gray-200 flex justify-center font-sans overflow-hidden'>
            <div className='w-full max-w-md bg-white h-screen sm:h-[90vh] sm:mt-[5vh] sm:rounded-[2.5rem] flex flex-col relative overflow-hidden shadow-2xl sm:border-[10px] sm:border-gray-800'>
              {toastMessage && (
                <div className='absolute top-20 left-1/2 transform -translate-x-1/2 bg-black/85 text-white px-6 py-3 rounded-full shadow-2xl z-[150] text-sm flex items-center gap-3 animate-fade-in border border-white/10 backdrop-blur-md whitespace-nowrap'>
                  <span className='text-blue-400'>
                    <Icon name='Info' size={16} />
                  </span>{' '}
                  {toastMessage}
                </div>
              )}

              {subView === 'missing-list' && (
                <MissingListView
                  onBack={() => setSubView(null)}
                  onAction={setSubView}
                  onMarkerSelect={handleMarkerSelect}
                />
              )}
              {/* --- 신규 메뉴 연결 --- */}
              {subView === 'my-profile' && (
                <MyProfileView
                  onBack={() => setSubView(null)}
                  onComplete={showToast}
                />
              )}
              {subView === 'my-reports' && (
                <MyReportsView onBack={() => setSubView(null)} />
              )}
              {subView === 'my-watchlist' && (
                <MissingListView
                  onBack={() => setSubView(null)}
                  onAction={setSubView}
                  onMarkerSelect={handleMarkerSelect}
                  isWatchlist={true}
                  title='관심 목록'
                />
              )}
              {subView === 'my-points' && (
                <MyPointHistoryView onBack={() => setSubView(null)} />
              )}

              {/* Reward Sub-views */}
              {subView === 'ranking' && (
                <RankingView onBack={() => setSubView(null)} />
              )}
              {subView === 'mission' && (
                <MissionView onBack={() => setSubView(null)} />
              )}
              {subView === 'wallet' && (
                <WalletView onBack={() => setSubView(null)} />
              )}
              {subView === 'point-exchange' && (
                <PointExchangeView
                  onBack={() => setSubView(null)}
                  onSelectProduct={item => {
                    setSelectedProduct(item)
                    setSubView('product-detail')
                  }}
                />
              )}
              {subView === 'product-detail' && (
                <ProductDetailView
                  product={selectedProduct}
                  onBack={() => setSubView('point-exchange')}
                  onPurchase={showToast}
                />
              )}

              {['notice', 'faq', 'qna', 'terms', 'privacy'].includes(
                subView
              ) && (
                <GenericTextView
                  type={subView}
                  title={
                    {
                      notice: '공지사항',
                      faq: '자주 묻는 질문',
                      qna: '1:1 문의',
                      terms: '이용약관',
                      privacy: '개인정보 처리방침'
                    }[subView]
                  }
                  onBack={() => setSubView(null)}
                />
              )}
              {/* --------------------- */}

              {subView === 'emergency-request' && (
                <EmergencySearchRequestView
                  onBack={() => setSubView(null)}
                  onComplete={showToast}
                  onSimulate={handleSimulateAlert}
                />
              )}
              {subView === 'emergency-sos' && (
                <EmergencySOSView
                  onBack={() => setSubView(null)}
                  onComplete={showToast}
                  onSimulate={handleSimulateAlert}
                />
              )}
              {subView === 'bystander-alert-detail' && (
                <BystanderAlertDetailView
                  onBack={() => setSubView(null)}
                  onNavigate={setSubView}
                  alertData={activeAlertData}
                />
              )}
              {subView === 'report-process' && (
                <ReportProcessView
                  onClose={() => setSubView(null)}
                  alertData={activeAlertData}
                  onComplete={showToast}
                />
              )}
              {subView === 'reward-detail' && (
                <RewardDetailView
                  onBack={() => setSubView(null)}
                  data={activeRewardData}
                />
              )}
              {subView === 'chat-detail' && (
                <ChatDetailView
                  onBack={() => setSubView(null)}
                  chatData={activeChatData}
                />
              )}
              {subView === 'notifications' && (
                <NotificationView onBack={() => setSubView(null)} />
              )}
              {subView === 'safe-return' && (
                <SafeReturnView onBack={() => setSubView(null)} />
              )}
              {subView === 'safe-zone' && (
                <SafeZoneView
                  onBack={() => setSubView(null)}
                  safeZones={safeZones}
                  onToggleZone={handleToggleSafeZone}
                  onSelectZone={zone => {
                    setSelectedSafeZone(zone)
                    setSubView('safe-zone-detail')
                  }}
                />
              )}
              {subView === 'safe-zone-detail' && (
                <SafeZoneDetailView
                  zone={selectedSafeZone}
                  onBack={() => setSubView('safe-zone')}
                  onDelete={handleDeleteSafeZone}
                />
              )}
              {subView === 'safe-keeper' && (
                <SafeKeeperView
                  onBack={() => setSubView(null)}
                  onSelectProfile={profile => {
                    setSelectedKeeperProfile(profile)
                    setSubView('safe-keeper-detail')
                  }}
                  onAdd={() => setSubView('add-safe-keeper')}
                  profiles={keeperProfiles}
                />
              )}
              {subView === 'add-safe-keeper' && (
                <AddSafeKeeperView
                  onBack={() => setSubView('safe-keeper')}
                  onComplete={handleAddKeeper}
                />
              )}
              {subView === 'safe-keeper-detail' && (
                <SafeKeeperDetailView
                  profile={selectedKeeperProfile}
                  onBack={() => setSubView('safe-keeper')}
                />
              )}

              <div className='flex-1 w-full relative overflow-hidden flex flex-col'>
                {activeTab === 'track' && (
                  <MapView
                    onAction={setSubView}
                    onNavigate={setSubView}
                    onMarkerSelect={handleMarkerSelect}
                    safeZones={safeZones}
                  />
                )}
                {activeTab === 'chat' && (
                  <ChatView
                    onSelect={chat => {
                      setActiveChatData(chat)
                      setSubView('chat-detail')
                    }}
                  />
                )}
                {activeTab === 'rewards' && (
                  <RewardsView
                    onSelect={item => {
                      setActiveRewardData(item)
                      setSubView('reward-detail')
                    }}
                    onNavigate={setSubView}
                  />
                )}
                {activeTab === 'menu' && (
                  <MenuView setSubView={setSubView} onAction={showToast} />
                )}
              </div>

              <div className='bg-white border-t flex justify-around py-3 pb-8 z-50 shadow-[0_-2px_15px_rgba(0,0,0,0.05)] flex-none relative'>
                <div
                  onClick={() => {
                    setActiveTab('track')
                    setSubView(null)
                  }}
                  className={`flex flex-col items-center cursor-pointer transition-all ${
                    activeTab === 'track'
                      ? 'text-[#4a4b70] scale-110'
                      : 'text-gray-400'
                  }`}
                >
                  <Icon name='Send' size={24} />
                  <span className='text-[10px] mt-1.5 font-bold'>홈</span>
                </div>
                <div
                  onClick={() => {
                    setActiveTab('chat')
                    setSubView(null)
                  }}
                  className={`flex flex-col items-center cursor-pointer transition-all ${
                    activeTab === 'chat'
                      ? 'text-[#4a4b70] scale-110'
                      : 'text-gray-400'
                  }`}
                >
                  <Icon name='MessageCircle' size={24} />
                  <span className='text-[10px] mt-1.5 font-bold'>채팅</span>
                </div>
                <div
                  onClick={() => {
                    setActiveTab('rewards')
                    setSubView(null)
                  }}
                  className={`flex flex-col items-center cursor-pointer transition-all ${
                    activeTab === 'rewards'
                      ? 'text-[#4a4b70] scale-110'
                      : 'text-gray-400'
                  }`}
                >
                  <Icon name='Gift' size={24} />
                  <span className='text-[10px] mt-1.5 font-bold'>보상</span>
                </div>
                <div
                  onClick={() => {
                    setActiveTab('menu')
                    setSubView(null)
                  }}
                  className={`flex flex-col items-center cursor-pointer transition-all ${
                    activeTab === 'menu'
                      ? 'text-[#4a4b70] scale-110'
                      : 'text-gray-400'
                  }`}
                >
                  <Icon name='Grid' size={24} />
                  <span className='text-[10px] mt-1.5 font-bold'>전체</span>
                </div>
              </div>
            </div>
          </div>
        )
      }

      const root = ReactDOM.createRoot(document.getElementById('root'))
      root.render(<App />)
    </script>
  </body>
</html>
