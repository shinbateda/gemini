<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track-FOM Pro: 지도 기반 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Leaflet CSS & JS (지도 엔진) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
      body {
        font-family: 'Noto Sans KR', sans-serif;
      }
      .range-slider {
        -webkit-appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 5px;
        background: #e5e7eb;
        outline: none;
      }
      .range-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #1e40af;
        cursor: pointer;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      .patent-badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid;
      }

      /* 지도 위 커스텀 아이콘 스타일 */
      .custom-pin {
        transition: all 0.5s ease;
        font-size: 3rem;
        text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        display: flex !important;
        justify-content: center;
        align-items: center;
      }

      /* 지도 오버레이 애니메이션 */
      .leaflet-interactive {
        transition: r 0.5s ease-out, fill-opacity 0.5s ease;
      }

      .target-btn.active-target {
        border-color: #3b82f6;
        background-color: #eff6ff;
        color: #1d4ed8;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="max-w-7xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col lg:flex-row h-[90vh]"
    >
      <!-- 왼쪽: 제어 패널 (Scrollable) -->
      <div
        class="w-full lg:w-4/12 p-6 border-r border-slate-200 overflow-y-auto bg-white z-10 shadow-lg"
      >
        <div class="mb-6">
          <h2 class="text-2xl font-black text-slate-800 tracking-tight">
            Track-FOM <span class="text-blue-600">Map</span>
          </h2>
          <p class="text-xs text-slate-500 font-medium mt-1">
            대상별(반려동물/사람) 이동 특성 반영 시뮬레이션
          </p>
        </div>

        <!-- 그룹 0: 추적 대상 선택 (New) -->
        <div class="mb-6">
          <label
            class="font-bold text-sm text-slate-700 flex items-center mb-2"
          >
            <i
              class="fa-solid fa-bullseye w-5 text-center text-red-500 mr-1"
            ></i
            >추적 대상 (Target Type)
          </label>
          <div class="flex gap-2">
            <button
              class="target-btn flex-1 py-3 text-sm font-bold rounded-xl border-2 border-slate-200 text-slate-400 hover:border-slate-300 transition-colors active-target"
              data-val="human"
              onclick="setTarget('human')"
            >
              <i class="fa-solid fa-person mb-1 block text-2xl"></i>
              사람 (어르신)
            </button>
            <button
              class="target-btn flex-1 py-3 text-sm font-bold rounded-xl border-2 border-slate-200 text-slate-400 hover:border-slate-300 transition-colors"
              data-val="pet"
              onclick="setTarget('pet')"
            >
              <i class="fa-solid fa-dog mb-1 block text-2xl"></i>
              반려동물
            </button>
          </div>
          <input type="hidden" id="input-target" value="human" />
        </div>

        <!-- 그룹 1: 물리적 환경 변수 -->
        <div
          class="mb-6 bg-slate-50 p-5 rounded-2xl border border-slate-200 relative"
        >
          <span
            class="absolute -top-3 left-4 bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded-full tracking-wider"
            >PATENT LOGIC</span
          >

          <!-- A. 이동 속도 -->
          <div class="mb-5">
            <div class="flex justify-between mb-2">
              <label class="font-bold text-sm text-slate-700 flex items-center">
                <i
                  class="fa-solid fa-person-running w-5 text-center text-blue-500 mr-1"
                ></i
                >이동 속도
              </label>
              <span
                id="val-speed"
                class="text-blue-700 font-bold text-sm bg-blue-100 px-2 py-0.5 rounded"
                >0 km/h</span
              >
            </div>
            <input
              type="range"
              id="input-speed"
              min="0"
              max="80"
              value="0"
              class="range-slider"
            />
            <div
              id="speed-warning"
              class="hidden mt-2 p-2 bg-red-50 border border-red-100 rounded text-[11px] text-red-600 font-bold animate-pulse"
            >
              ⚠️ 경고: 대상의 생체 물리적 한계 속도를 초과했습니다. (차량 탑승
              의심)
            </div>
          </div>

          <!-- B. 주변 환경 -->
          <div>
            <label
              class="font-bold text-sm text-slate-700 flex items-center mb-2"
            >
              <i
                class="fa-solid fa-building w-5 text-center text-indigo-500 mr-1"
              ></i
              >환경 모드
            </label>
            <div class="flex gap-2">
              <button
                class="env-btn flex-1 py-2 text-xs font-bold rounded-lg border-2 border-slate-200 text-slate-400 hover:border-slate-300 transition-colors"
                data-val="indoor"
                onclick="setEnv('indoor')"
              >
                실내 (도심)
              </button>
              <button
                class="env-btn flex-1 py-2 text-xs font-bold rounded-lg border-2 border-green-500 bg-green-50 text-green-700 active-env"
                data-val="outdoor"
                onclick="setEnv('outdoor')"
              >
                실외 (개활지)
              </button>
            </div>
            <input type="hidden" id="input-env" value="outdoor" />
          </div>
        </div>

        <!-- 그룹 2: 신호 변수 -->
        <div class="space-y-5">
          <!-- 1. RSSI -->
          <div>
            <div class="flex justify-between mb-2">
              <label class="font-bold text-sm text-slate-700"
                >신호 강도 (RSSI)</label
              >
              <span
                id="val-rssi"
                class="text-slate-600 font-mono font-bold text-sm"
                >-70 dBm</span
              >
            </div>
            <input
              type="range"
              id="input-rssi"
              min="-100"
              max="-30"
              value="-70"
              class="range-slider"
            />
          </div>

          <!-- 2. Time -->
          <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
            <div class="flex justify-between mb-2">
              <label class="font-bold text-sm text-orange-800"
                >실종 경과 시간</label
              >
              <span
                id="val-time"
                class="text-orange-600 font-mono font-bold text-sm"
                >0 min</span
              >
            </div>
            <input
              type="range"
              id="input-time"
              min="0"
              max="60"
              step="1"
              value="0"
              class="range-slider !bg-orange-200"
            />
            <p class="text-[10px] text-orange-500 mt-2">
              * 시간이 흐를수록 지도상 수색 반경이 넓어집니다.
            </p>
          </div>
        </div>

        <!-- 하단 로그 -->
        <div class="mt-6 pt-4 border-t border-slate-200">
          <div class="font-mono text-[10px] text-slate-400 mb-2">
            System Log
          </div>
          <div
            id="log-container"
            class="space-y-1 h-32 overflow-y-auto text-[10px] text-slate-500 font-mono"
          >
            <!-- Logs injected here -->
          </div>
        </div>
      </div>

      <!-- 오른쪽: 지도 패널 -->
      <div class="w-full lg:w-8/12 relative bg-slate-200 h-full">
        <!-- Leaflet Map Container -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- 상단 상태 오버레이 -->
        <div
          class="absolute top-4 right-4 z-[500] flex flex-col gap-2 items-end pointer-events-none"
        >
          <div
            class="bg-white/90 backdrop-blur px-4 py-3 rounded-xl shadow-lg border border-slate-200 text-right"
          >
            <div
              class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1"
            >
              Confidence Score
            </div>
            <div
              class="text-3xl font-black text-slate-800 leading-none"
              id="ui-score-lg"
            >
              85
            </div>
          </div>

          <div
            class="bg-white/90 backdrop-blur px-3 py-2 rounded-lg shadow-sm border border-slate-200 text-right"
          >
            <div
              class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1"
            >
              Estimated Radius
            </div>
            <div
              class="text-lg font-bold text-slate-700 leading-none font-mono"
              id="ui-radius-meters"
            >
              ±25m
            </div>
          </div>

          <div class="flex gap-1">
            <span
              id="badge-target"
              class="patent-badge bg-blue-50 border-blue-200 text-blue-700 shadow-sm font-bold"
              >Target: Human</span
            >
            <span
              id="badge-physics"
              class="patent-badge bg-white border-slate-200 text-slate-400 shadow-sm"
              >Stable Velocity</span
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      // 1. Leaflet Map Initialization
      // 위치: 경기도 파주시 (아이티에스뱅크 소재지 인근)
      const map = L.map('map', {
        zoomControl: false
      }).setView([37.76, 126.78], 16)

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map)

      L.control.zoom({ position: 'bottomright' }).addTo(map)

      // 2. Map Elements
      const safeZone = L.circle([37.76, 126.78], {
        color: '#3b82f6',
        fillColor: '#3b82f6',
        fillOpacity: 0.2,
        radius: 50
      }).addTo(map)

      const pinIcon = L.divIcon({
        className: 'custom-pin',
        html: '<div id="pin-content">👤</div>',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      })

      const userMarker = L.marker([37.76, 126.78], { icon: pinIcon }).addTo(map)

      // 3. Logic & DOM Elements
      const inputs = {
        target: document.getElementById('input-target'),
        rssi: document.getElementById('input-rssi'),
        time: document.getElementById('input-time'),
        speed: document.getElementById('input-speed'),
        env: document.getElementById('input-env')
      }
      const displays = {
        rssi: document.getElementById('val-rssi'),
        time: document.getElementById('val-time'),
        speed: document.getElementById('val-speed'),
        scoreLg: document.getElementById('ui-score-lg'),
        radiusMeters: document.getElementById('ui-radius-meters'),
        warning: document.getElementById('speed-warning')
      }
      const badges = {
        target: document.getElementById('badge-target'),
        physics: document.getElementById('badge-physics')
      }
      const logContainer = document.getElementById('log-container')

      let currentEnv = 'outdoor'
      let currentTarget = 'human'

      // --- Event Handlers ---

      function setTarget(val) {
        currentTarget = val
        inputs.target.value = val

        // Toggle UI Buttons
        document.querySelectorAll('.target-btn').forEach(btn => {
          if (btn.dataset.val === val) {
            btn.classList.add('active-target')
            btn.classList.remove('border-slate-200', 'text-slate-400')
          } else {
            btn.classList.remove('active-target')
            btn.classList.add('border-slate-200', 'text-slate-400')
          }
        })

        // Update Map Icon & Badge
        const pinEl = document.getElementById('pin-content')
        if (val === 'human') {
          pinEl.innerText = '👤'
          badges.target.innerText = 'Target: Human'
        } else {
          pinEl.innerText = '🐶' // Updated to Puppy Face
          badges.target.innerText = 'Target: Pet'
        }

        calculate()
      }

      function setEnv(val) {
        currentEnv = val
        inputs.env.value = val
        document.querySelectorAll('.env-btn').forEach(btn => {
          if (btn.dataset.val === val) {
            btn.classList.add(
              'border-green-500',
              'bg-green-50',
              'text-green-700',
              'active-env'
            )
            btn.classList.remove('border-slate-200', 'text-slate-400')
          } else {
            btn.classList.remove(
              'border-green-500',
              'bg-green-50',
              'text-green-700',
              'active-env'
            )
            btn.classList.add('border-slate-200', 'text-slate-400')
          }
        })
        calculate()
      }

      function calculate() {
        const rssi = parseInt(inputs.rssi.value)
        const timeMin = parseFloat(inputs.time.value)
        const speedKmh = parseInt(inputs.speed.value)

        // Display Updates
        displays.rssi.innerText = `${rssi} dBm`
        displays.time.innerText = `${timeMin} min`
        displays.speed.innerText = `${speedKmh} km/h`

        // --- Patent Logic: Target-Aware Velocity Filter ---

        // 1. Define Speed Thresholds based on Target
        let speedLimit = 0
        if (currentTarget === 'human') {
          // Elderly walking speed avg ~4-5km/h.
          // Running > 15km/h unlikely.
          speedLimit = 15
        } else {
          // Dogs can run faster.
          // Greyhound 70km/h, but avg dog run ~30km/h.
          speedLimit = 40
        }

        // 2. Penalty Calculation
        let velocityPenalty = 0
        if (speedKmh > speedLimit) {
          // Exceeded biological limit -> Likely vehicle or GPS error
          velocityPenalty = (speedKmh - speedLimit) * 2
          displays.warning.classList.remove('hidden')

          // Update badge text
          badges.physics.innerText = '⚠️ Velocity Mismatch'
          badges.physics.className =
            'patent-badge bg-red-50 border-red-200 text-red-600 font-bold animate-pulse'
        } else {
          displays.warning.classList.add('hidden')
          badges.physics.innerText = 'Stable Velocity'
          badges.physics.className =
            'patent-badge bg-white border-slate-200 text-slate-400'
        }

        // 3. Base Score Calculation
        let baseScore = (rssi + 100) / 70 // 0~1
        if (baseScore < 0) baseScore = 0
        if (baseScore > 1) baseScore = 1

        const envFactor = currentEnv === 'indoor' ? 0.85 : 1.0

        // Speed decay based on target physics
        // Pets move more erratically -> diffusion happens faster?
        // Actually, faster speed = faster diffusion regardless of type.
        const speedDecay = speedKmh * 0.05
        const decayRate = 0.05 + speedDecay
        let timeFactor = Math.exp(-decayRate * timeMin)

        let fom = Math.round(baseScore * envFactor * timeFactor * 100)

        // Apply Penalty
        fom -= velocityPenalty
        if (fom < 0) fom = 0
        if (fom > 100) fom = 100

        // --- Map Logic ---
        const baseError = 20
        const timeDrift = timeMin * 10
        const speedDrift = speedKmh * timeMin * 5
        const envDrift = currentEnv === 'indoor' ? 15 : 0

        let radiusMeters = baseError + timeDrift + speedDrift + envDrift
        if (radiusMeters > 2000) radiusMeters = 2000

        // Update Map Visuals
        let circleColor = '#3b82f6'
        if (fom < 40) circleColor = '#ef4444'
        else if (fom < 70) circleColor = '#22c55e'

        safeZone.setRadius(radiusMeters)
        safeZone.setStyle({
          color: circleColor,
          fillColor: circleColor,
          fillOpacity: Math.max(0.1, fom / 200)
        })

        const pinEl = document.getElementById('pin-content')
        if (pinEl) {
          const blurAmount = Math.min((100 - fom) / 10, 5)
          const opacity = Math.max(fom / 100, 0.3)

          pinEl.style.filter = `blur(${blurAmount}px)`
          pinEl.style.opacity = opacity

          // Keep the icon consistent with target type
          const iconChar = currentTarget === 'human' ? '👤' : '🐶' // Updated to Puppy Face

          if (fom < 30) pinEl.innerText = '❓'
          else pinEl.innerText = iconChar
        }

        displays.scoreLg.innerText = fom
        displays.radiusMeters.innerText = `±${Math.round(radiusMeters)}m`

        if (Math.random() > 0.8) addLog(fom, radiusMeters, currentTarget)
      }

      function addLog(fom, radius, target) {
        const time = new Date().toLocaleTimeString().split(' ')[0]
        const logItem = document.createElement('div')
        logItem.className = 'border-b border-slate-100 pb-1'
        logItem.innerHTML = `<span class="text-slate-400">[${time}]</span> <span class="font-bold">${target.toUpperCase()}</span> FOM:${fom} / Rad:${Math.round(
          radius
        )}m`
        logContainer.prepend(logItem)
        if (logContainer.children.length > 6)
          logContainer.lastElementChild.remove()
      }

      Object.values(inputs).forEach(input => {
        input.addEventListener('input', calculate)
      })

      setTimeout(() => {
        map.invalidateSize()
        setTarget('human')
      }, 500)
    </script>
  </body>
</html>
