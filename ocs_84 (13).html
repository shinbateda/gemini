        let contactStats = { total: 0, confirmed: 0 };
        function recalculateStats() {
            contactStats = { total: 0, confirmed: 0 };
            Object.keys(rosterData).forEach(co => {
                rosterData[co].forEach(platoon => {
                    platoon.names.forEach(name => {
                        if (name.trim() !== "") {
                            contactStats.total++;
                            const specificKey = `${co}_${platoon.title}_${name}`;
                            const info = phoneData[specificKey] || phoneData[name];
                            if (info && info.phone && info.phone.trim() !== "") {
                                contactStats.confirmed++;
                            }
                        }
                    });
                });
            });
        }

        // --- 자동 저장 통합 함수 ---
        // 입력 값이 변경될 때마다 0.5초(500ms) 후에 자동으로 저장 로직을 수행합니다.
        window.handleAutoSave = function(key, name) {
            // 타이머 초기화 (연속 입력 시 대기)
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            
            autoSaveTimer = setTimeout(() => {
                // 1. 값 가져오기
                const phoneInput = document.getElementById(`phone-edit-${key}`);
                const remarkInput = document.getElementById(`remark-${key}`);
                const branchSelect = document.getElementById(`branch-edit-${key}`);
                
                const newPhone = phoneInput ? phoneInput.value.trim() : '';
                const newRemark = remarkInput ? remarkInput.value.trim() : '';
                const newBranch = branchSelect ? branchSelect.value : '';

                let isChanged = false;

                // 2. 전화번호 저장
                if (phoneInput && (phoneData[key]?.phone !== newPhone)) {
                    let savedPhones = JSON.parse(localStorage.getItem('ocs84_imported_phones')) || {};
                    savedPhones[key] = newPhone;
                    savedPhones[name] = newPhone; // 호환성 유지
                    localStorage.setItem('ocs84_imported_phones', JSON.stringify(savedPhones));
                    
                    if (!phoneData[key]) phoneData[key] = { branch: "미상" };
                    phoneData[key].phone = newPhone;
                    if (!phoneData[name]) phoneData[name] = { branch: "미상" };
                    phoneData[name].phone = newPhone;
                    isChanged = true;
                }

                // 3. 비고 저장
                let savedRemarks = JSON.parse(localStorage.getItem('ocs84_remarks')) || {};
                const currentRemark = savedRemarks[key] || '';
                if (remarkInput && currentRemark !== newRemark) {
                    savedRemarks[key] = newRemark;
                    savedRemarks[name] = newRemark;
                    localStorage.setItem('ocs84_remarks', JSON.stringify(savedRemarks));
                    isChanged = true;
                }

                // 4. 병과 저장
                if (branchSelect && (phoneData[key]?.branch !== newBranch)) {
                    let savedBranches = JSON.parse(localStorage.getItem('ocs84_imported_branches')) || {};
                    savedBranches[key] = newBranch;
                    savedBranches[name] = newBranch;
                    localStorage.setItem('ocs84_imported_branches', JSON.stringify(savedBranches));
                    
                    if(phoneData[key]) phoneData[key].branch = newBranch;
                    if(phoneData[name]) phoneData[name].branch = newBranch;
                    isChanged = true;
                }

                // 5. 변경사항이 있으면 통계 재계산 및 UI 즉시 업데이트
                if (isChanged) {
                    recalculateStats();
                    renderContactList(); // 연락망 UI 리렌더링
                    renderRosterList();  // 명단 UI 리렌더링 (병과 색상 등 반영)
                    renderNav();         // 상단 탭 숫자 반영
                    showToast('자동 저장되었습니다.');
                }
            }, 500); // 0.5초 딜레이
        };

                            const info = phoneData[specificKey] || phoneData[name];
                            if (info && info.phone && !deceasedMembers.includes(name)) {
                                const cleanPhone = info.phone.replace(/[^0-9]/g, '');
                                if (cleanPhone) {
                                    vcfContent += "BEGIN:VCARD\n";
                                    vcfContent += "VERSION:3.0\n";
                                    const branchStr = info.branch ? info.branch : '미상';
                                    vcfContent += `FN:${name}(OCS84 ${branchStr})\n`;
                                    vcfContent += `N:;${name}(OCS84 ${branchStr});;;\n`;
                                    vcfContent += "ORG:해군 OCS 84차 동기회\n";

                                    vcfContent += `TEL;TYPE=CELL:${cleanPhone}\n`;
                                    vcfContent += "END:VCARD\n";
                                }
                            }
                        }
                    });
                });
            });
            const blob = new Blob(["\uFEFF" + vcfContent], { type: 'text/vcard;charset=utf-8;' });

        window.generateEventText = function() {

                title = `[부고] OCS 84차 ${name} 동기 ${relation}상`;
                body = `OCS 84차 ${name} 동기의 ${relation}께서 별세하셨기에 삼가 알려드립니다.\n\n바쁘시더라도 따뜻한 위로와 명복을 빌어주시면 감사하겠습니다.\n\n■ 일시: ${date}\n■ 빈소: ${location}\n■ 마음 전하실 곳: ${account}`;
            } else if (type === '결혼') {
                title = `[결혼] OCS 84차 ${name} 동기 ${relation} 결혼`;
                body = `OCS 84차 ${name} 동기의 ${relation} 결혼식이 있습니다.\n\n새 출발을 하는 두 사람을 위해 축복해 주시면 감사하겠습니다.\n\n■ 일시: ${date}\n■ 장소: ${location}\n■ 마음 전하실 곳: ${account}`;
            } else {
                title = `[알림] OCS 84차 ${name} 동기 ${relation} ${type}`;
                body = `OCS 84차 ${name} 동기의 ${relation} ${type} 소식을 전합니다.\n\n■ 일시: ${date}\n■ 장소: ${location}\n■ 마음 전하실 곳: ${account}`;
            }

            document.getElementById('event-preview').value = `${title}\n\n${body}`;
